<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de sessões | Hydra</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&display=swap');
:root { --paper:#fff8f1; --panel:#fffdf9; --ink:#36222e; --dark:#382336; --side-ink:#fff1f5; --muted:#664c59; --rule:#d9c6bf; --field:#85646c; --red:#ae3326; --pink:#ffdacd; }
* { box-sizing:border-box }
body { margin:0; color:var(--ink); background:var(--paper); font:1rem/1.45 'Instrument Sans',system-ui,sans-serif }
button,textarea,select,summary { font:inherit; color:inherit }
button,summary,select { cursor:pointer }
:focus-visible { outline:3px solid var(--red); outline-offset:3px }
.skip { position:absolute; z-index:2; top:.65rem; left:.65rem; transform:translateY(-170%); background:var(--panel); color:var(--ink); padding:.75rem }
.skip:focus { transform:none }
.frame { min-height:100vh; display:grid; grid-template-columns:17.75rem minmax(0,1fr) }
.navigation { padding:1.5rem 1.15rem; color:var(--side-ink); background:var(--dark); display:flex; flex-direction:column; gap:1.4rem }
.navigation :focus-visible { outline-color:#ffd5c8 }
.wordmark { margin:.25rem .6rem; font:400 2rem/1 'Archivo Black',sans-serif; letter-spacing:-.025em }
.wordmark svg { width:1.4rem; height:1.4rem; margin-right:.6rem; color:#ffb29b }
.nav-group { display:grid; gap:.35rem }
.nav-group button { min-height:2.75rem; display:flex; gap:.72rem; align-items:center; padding:.6rem .75rem; border:1px solid transparent; border-radius:.35rem; background:transparent; text-align:left; color:var(--side-ink) }
.nav-group span { flex:none; width:1.15rem; text-align:center }
.nav-group button[aria-current] { background:#ffe4da; color:#452031; font-weight:700 }
.nav-extra { padding-top:1rem; border-top:1px solid #785565 }
.nav-settings { margin-top:auto }
.mobile { display:none }
main { min-width:0 }
.topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem 1rem; padding:.8rem clamp(1rem,3.7vw,4rem); border-bottom:1px solid var(--rule); min-height:4.25rem }
.topbar strong { font-weight:700 }
.topbar span { color:var(--muted); font-size:.875rem }
.content { width:min(100%,82rem); margin:auto; padding:clamp(1.5rem,2.7vw,3rem) clamp(1rem,3.7vw,4rem) 3rem; display:grid; grid-template-columns:minmax(0,1fr); gap:1.35rem }
.heading { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:.75rem }
h1 { margin:0; font:400 clamp(2.25rem,4.1vw,4.75rem)/.98 'Archivo Black',sans-serif; letter-spacing:-.035em; overflow-wrap:anywhere }
.heading p { margin:.55rem 0 0; color:var(--muted) }
.compose { width:min(100%,54rem); justify-self:center; margin-top:1rem }
.task { border:1px solid var(--field); background:var(--panel); }
.task-top { background:var(--red); color:#fff; padding:.9rem 1.25rem; }
.task-top h2 { font-size:1.25rem; margin:0 }
.task-body { padding:1.15rem 1.25rem 1.25rem; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); grid-template-areas:"prompt setup" "actions actions"; align-items:start; gap:.75rem 1.25rem }
.objective { grid-area:prompt }
.task-body label { display:block; margin:0 0 .4rem; font-weight:700 }
textarea { display:block; width:100%; min-height:7rem; resize:vertical; padding:.7rem .8rem; border:1px solid var(--field); border-radius:.25rem; background:var(--panel) }
textarea::placeholder { color:var(--muted) }
.setup { grid-area:setup; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.75rem }
.setup div:last-child { grid-column:1/-1 }
.setup label { font-size:.875rem; color:var(--muted) }
.setup select { display:block; width:100%; min-width:0; min-height:2.75rem; border:1px solid var(--field); border-radius:.25rem; padding:.5rem; background:var(--panel) }
.send { grid-area:actions; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.7rem }
.send span { font-size:.875rem; color:var(--muted) }
.primary { background:var(--red); color:white; border:1px solid var(--red); padding:.6rem 1rem; min-height:2.75rem; border-radius:.25rem; font-weight:700 }
.history { background:#f6e9e4; border-top:3px solid var(--ink); padding:.65rem 1rem .5rem }
.history h2 { margin:0 0 .6rem; font-size:1.15rem }
.history ul { display:grid; gap:0; list-style:none; padding:0; margin:0 }
.history button { display:grid; width:100%; min-height:3.5rem; grid-template-columns:1.35rem minmax(0,1fr) auto; align-items:center; gap:.6rem; border:0; border-bottom:1px solid var(--rule); padding:.5rem 0; background:transparent; text-align:left }
.history strong,.history small { display:block; overflow-wrap:anywhere }
.history small { color:var(--muted); margin-top:.15rem; font-size:.8125rem }
.history .status { color:#76301f; background:var(--pink); padding:.22rem .45rem; font-size:.75rem; line-height:1.3; font-weight:700; max-width:8rem; overflow-wrap:anywhere }
.history .done { color:#29503e; background:#e1eee3 }
.templates { margin-top:1.3rem }
.templates h2 { margin:0 0 .3rem; font-size:.95rem }
.templates div { display:flex; gap:.4rem .8rem; flex-wrap:wrap }
.templates button { min-height:2.75rem; background:transparent; border:0; padding:.35rem .2rem; color:#8c2c24; font-weight:700; text-decoration:underline; text-underline-offset:.16em; text-align:left }
@media (hover:hover) and (pointer:fine) {
  .nav-group button:hover:not([aria-current]) { background:#553448 }
  .primary:hover { background:#89281e }
  .history button:hover { background:#f5e7e0 }
}
@media (max-width:66rem) { .frame { grid-template-columns:14.5rem minmax(0,1fr) }.history button { grid-template-columns:1.35rem minmax(0,1fr) }.history .status { grid-column:2 } }
@media (max-width:56rem) {
  .task-body { grid-template-columns:1fr; grid-template-areas:"prompt" "setup" "actions" }
  .history ul { grid-template-columns:1fr }
  .history button { grid-template-columns:1.35rem minmax(0,1fr) auto }
  .history .status { grid-column:auto }
}
@media (max-width:48rem) {
  .frame { display:block }
  .navigation { display:none }
  .mobile { display:block; background:var(--dark); color:var(--side-ink); padding:.65rem 1rem }
  .mobile :focus-visible { outline-color:#ffd5c8 }
  .mobile summary { min-height:2.75rem; width:fit-content; padding:.35rem 0 }
  .mobile strong { font:400 1.35rem 'Archivo Black',sans-serif; margin-right:.5rem }
  .mobile nav { margin-top:.5rem }
  .topbar { min-height:0 }
  .compose { margin-top:0 }
  .heading { flex-wrap:nowrap }
  .task-body,.task-top { padding-inline:.85rem }
  .primary { flex:1 1 100% }
}
@media (max-width:21rem) { .setup { grid-template-columns:1fr }.history button { grid-template-columns:1.35rem minmax(0,1fr) }.history .status { grid-column:2 } }
@media (forced-colors:active) { :focus-visible { outline-color:Highlight !important } .nav-group button[aria-current] { border-color:ButtonText } }
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="frame">
  <aside class="navigation">
    <div class="wordmark"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 5v10M16 5v10M4 10h12M10 5v10"/></svg>Hydra</div>
    <nav class="nav-group" aria-label="Navegação principal">
      <button type="button" aria-current="page"><span aria-hidden="true">▤</span>Tarefas e sessões</button>
      <button type="button"><span aria-hidden="true">▱</span>Projetos</button>
      <button type="button"><span aria-hidden="true">◷</span>Automações</button>
    </nav>
    <nav class="nav-group nav-extra" aria-label="Administração">
      <button type="button"><span aria-hidden="true">▦</span>Recursos</button>
      <button type="button"><span aria-hidden="true">≋</span>Contas e consumo</button>
    </nav>
    <nav class="nav-group nav-settings" aria-label="Preferências"><button type="button"><span aria-hidden="true">⊞</span>Configurações</button></nav>
  </aside>
  <details class="mobile">
    <summary><strong>Hydra</strong> Menu</summary>
    <nav class="nav-group" aria-label="Navegação principal">
      <button type="button" aria-current="page">Tarefas e sessões</button><button type="button">Projetos</button><button type="button">Automações</button><button type="button">Recursos</button><button type="button">Contas e consumo</button><button type="button">Configurações</button>
    </nav>
  </details>
  <main id="conteudo" tabindex="-1">
    <header class="topbar"><strong>Loja Aurora</strong><span>Ambiente local</span></header>
    <div class="content">
      <header class="heading">
        <div><h1>Tarefas e sessões</h1><p>Comece uma tarefa ou volte ao que está em andamento.</p></div>
      </header>
        <section class="history">
          <h2>Sessões recentes</h2>
          <ul>
            <li><button type="button"><span aria-hidden="true">◉</span><span><strong>Revisar checkout</strong><small>Loja Aurora</small></span><span class="status">Em execução</span></button></li>
            <li><button type="button"><span aria-hidden="true">✓</span><span><strong>Atualizar catálogo</strong><small>Loja Aurora</small></span><span class="status done">Concluída</span></button></li>
          </ul>
        </section>
        <div class="compose">
          <section class="task" aria-labelledby="create-heading">
            <div class="task-top"><h2 id="create-heading">Nova tarefa</h2></div>
            <div class="task-body">
              <div class="objective">
                <label for="objective-c">O que precisa ser feito?</label>
                <textarea id="objective-c" rows="3" placeholder="Ex.: revisar as alterações no checkout"></textarea>
              </div>
              <div class="setup">
                <div><label for="project-c">Projeto</label><select id="project-c"><option>Loja Aurora</option></select></div>
                <div><label for="agent-c">Agente</label><select id="agent-c"><option>Codex</option><option>Claude</option></select></div>
                <div><label for="mode-c">Modo</label><select id="mode-c"><option>Em sequência (relay)</option><option>Em paralelo (swarm)</option><option>Persistente</option></select></div>
              </div>
              <div class="send"><span>Branch <strong>main</strong></span><button class="primary" type="button">Criar tarefa</button></div>
            </div>
          </section>
          <section class="templates"><h2>Comece por um modelo</h2><div><button type="button">Revisar alterações</button><button type="button">Executar testes</button></div></section>
        </div>
    </div>
  </main>
</div>
</body>
</html>
