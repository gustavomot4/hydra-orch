<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo de trabalho | Hydra</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Work+Sans:wght@600;700;800&display=swap');
:root { --ink:#14203b; --quiet:#435471; --blue:#1848d6; --blue-deep:#1439ac; --pale:#eaf0ff; --rule:#c9d4ed; --control:#667ba6; --white:#fff; }
* { box-sizing:border-box }
body { margin:0; background:#f8faff; color:var(--ink); font:1rem/1.45 'Atkinson Hyperlegible Next',system-ui,sans-serif }
button,textarea,select,summary { font:inherit; color:inherit }
button,summary { cursor:pointer }
:focus-visible { outline:3px solid var(--blue-deep); outline-offset:3px }
.skip { position:absolute; top:.5rem; left:.5rem; transform:translateY(-160%); z-index:2; background:var(--white); color:var(--blue-deep); padding:.75rem }
.skip:focus { transform:none }
.app { display:grid; grid-template-columns:minmax(0,1fr) 16.5rem; grid-template-areas:"main rail"; min-height:100vh }
.rail { grid-area:rail; background:var(--pale); border-left:1px solid var(--rule); padding:1.55rem 1rem; display:flex; flex-direction:column; gap:1.8rem }
.logo { display:flex; align-items:center; gap:.65rem; margin:0 .55rem; color:var(--blue-deep); font:800 1.9rem/1 'Work Sans',sans-serif; letter-spacing:-.03em }
.logo svg { width:1.4rem; height:1.4rem; flex:none }
.menu { display:grid; gap:.25rem }
.menu button,.log button { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; min-height:2.75rem; background:transparent; border:1px solid transparent; border-radius:.65rem; padding:.5rem .75rem }
.menu button span { flex:none; width:1.1rem; text-align:center; font-size:1.15rem }
.menu button[aria-current] { color:var(--white); background:var(--blue-deep); font-weight:700 }
.log { border-top:1px solid var(--rule); padding-top:1.05rem }
.log h2 { margin:0 .75rem .45rem; font-size:.875rem; color:var(--quiet) }
.log button { align-items:baseline; padding-block:.65rem; font-weight:700; line-height:1.3 }
.log small { display:block; font-size:.8125rem; color:var(--quiet); font-weight:400 }
.settings { margin-top:auto }
.mobile { display:none }
main { grid-area:main; min-width:0 }
.hero { background:var(--blue); color:#fff; min-height:18rem; padding:1.15rem clamp(1rem,4.5vw,5.5rem) 2rem; position:relative; isolation:isolate; overflow:hidden }
.hero-content { position:relative; z-index:1 }
.context { display:flex; gap:.65rem; align-items:center; flex-wrap:wrap; margin:0 0 2.35rem; font-weight:600 }
.context span { color:#e1e9ff }
h1 { max-width:12ch; margin:0; font:800 clamp(2.55rem,5vw,5.25rem)/1.01 'Work Sans',sans-serif; letter-spacing:-.027em }
.paths { position:absolute; inset:0 0 0 auto; width:min(43%,30rem); opacity:.76; display:grid; align-content:center; gap:1.15rem; transform:translateX(12%) }
.paths i { display:block; height:2.1rem; border:2px solid #a7c4ff; border-left:0; border-radius:0 4rem 4rem 0; transform:skewX(-30deg) }
.paths i:nth-child(2) { width:80%; border-color:#fff; border-width:3px }
.paths i:nth-child(3) { width:92%; }
.paths i:nth-child(4) { width:60%; }
.board { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(13rem,1fr); grid-template-areas:"prompt route" "finish route"; gap:0 clamp(1.25rem,4.5vw,4rem); padding:clamp(1rem,3.5vw,3rem) clamp(1rem,4.5vw,5.5rem) 2.5rem; }
.prompt { grid-area:prompt }
.finish { grid-area:finish }
.prompt h2,.route h2 { margin:0 0 .8rem; font:700 1.4rem/1.2 'Work Sans',sans-serif }
.prompt label { display:block; margin:0 0 .4rem; font-weight:700 }
textarea { display:block; width:100%; min-height:9rem; border:1px solid var(--control); border-radius:.75rem; padding:1rem; resize:vertical; background:#fff }
textarea::placeholder { color:var(--quiet) }
.primary { display:block; min-height:2.75rem; margin:1rem 0 0 auto; padding:.65rem 1.15rem; border:1px solid var(--blue-deep); border-radius:.65rem; background:var(--blue-deep); color:#fff; font-weight:700 }
.route { grid-area:route; border-left:1px solid var(--rule); padding-left:clamp(1rem,3vw,2.5rem); min-width:0 }
.route dl { margin:0 0 .9rem }
.route dt { color:var(--quiet); font-size:.875rem }
.route dd { margin:.15rem 0 .7rem; font-weight:700 }
.route label { display:block; margin:0 0 .3rem; font-size:.875rem; font-weight:700 }
.route select { display:block; width:100%; min-width:0; min-height:2.75rem; margin:0 0 .75rem; padding:.55rem; border:1px solid var(--control); border-radius:.45rem; background:#fff; }
.templates { margin-top:1.45rem; border-top:1px solid var(--rule); padding-top:.9rem }
.templates h2 { font:700 1rem 'Atkinson Hyperlegible Next',sans-serif; margin:0 0 .2rem }
.templates div { display:flex; flex-wrap:wrap; gap:.15rem .9rem }
.templates button { min-height:2.75rem; text-align:left; background:transparent; color:var(--blue-deep); border:0; padding:.35rem .2rem; text-decoration:underline; text-underline-offset:.16em; font-weight:700 }
@media (hover:hover) and (pointer:fine) {
  .menu button:hover:not([aria-current]),.log button:hover { background:#d9e4ff }
  .primary:hover { background:#102d8a }
}
@media (max-width:63rem) { .app { grid-template-columns:minmax(0,1fr) 14rem }.board { column-gap:1rem } }
@media (max-width:54rem) {
  .board { grid-template-columns:1fr; grid-template-areas:"prompt" "route" "finish" }
  .route { border:0; border-top:1px solid var(--rule); padding:1rem 0 0; margin-top:1rem; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 .7rem }
  .route h2 { grid-column:1/-1 }
  .route .mode { grid-column:1/-1 }
  .route dl { display:none }
  .paths { width:34%; }
}
@media (max-width:48rem) {
  .app { display:block }
  .rail { display:none }
  .mobile { display:block; background:var(--pale); padding:.6rem 1rem }
  .mobile summary { min-height:2.75rem; padding:.4rem 0; width:fit-content }
  .mobile strong { color:var(--blue-deep); font:800 1.35rem 'Work Sans',sans-serif; margin-right:.6rem }
  .mobile nav { margin-top:.4rem }
  .hero { min-height:0; padding:1.1rem 1rem 1.5rem }
  .context { margin-bottom:.65rem }
  h1 { max-width:11ch }
  .paths { width:25%; transform:translateX(28%) }
  .paths i { height:1rem }
  .primary { width:100% }
}
@media (forced-colors:active) { :focus-visible { outline-color:Highlight } .menu button[aria-current] { border-color:ButtonText } }
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="app">
  <aside class="rail">
    <div class="logo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 5v10M16 5v10M4 10h12M10 5v10"/></svg>Hydra</div>
    <nav class="menu" aria-label="Navegação principal">
      <button type="button" aria-current="page"><span aria-hidden="true">＋</span>Nova tarefa</button>
      <button type="button"><span aria-hidden="true">▤</span>Projetos e sessões</button>
      <button type="button"><span aria-hidden="true">◷</span>Automações</button>
      <button type="button"><span aria-hidden="true">▦</span>Recursos</button>
      <button type="button"><span aria-hidden="true">≋</span>Contas e consumo</button>
    </nav>
    <section class="log">
      <h2>Sessões recentes</h2>
      <button type="button"><span aria-hidden="true">◉</span><span>Revisar checkout<small>Loja Aurora · Em execução</small></span></button>
      <button type="button"><span aria-hidden="true">✓</span><span>Atualizar catálogo<small>Loja Aurora · Concluída</small></span></button>
    </section>
    <nav class="menu settings" aria-label="Preferências"><button type="button"><span aria-hidden="true">⊞</span>Configurações</button></nav>
  </aside>
  <details class="mobile">
    <summary><strong>Hydra</strong> Menu</summary>
    <nav class="menu" aria-label="Navegação principal">
      <button type="button" aria-current="page">Nova tarefa</button><button type="button">Projetos e sessões</button><button type="button">Automações</button><button type="button">Recursos</button><button type="button">Contas e consumo</button><button type="button">Configurações</button>
    </nav>
  </details>
  <main id="conteudo" tabindex="-1">
    <header class="hero">
      <div class="hero-content">
        <p class="context">Loja Aurora <span>· Ambiente local</span></p>
        <h1>O que vamos fazer?</h1>
      </div>
      <div class="paths" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>
    <div class="board">
      <section class="prompt" aria-labelledby="objective-title">
        <h2 id="objective-title">Nova tarefa</h2>
        <label for="objective-b">Objetivo</label>
        <textarea id="objective-b" rows="4" placeholder="Ex.: revisar as alterações no checkout"></textarea>
      </section>
      <section class="route">
        <h2>Onde e com quem</h2>
        <div><label for="project-b">Projeto</label><select id="project-b"><option>Loja Aurora</option></select></div>
        <dl><dt>Branch</dt><dd>main</dd></dl>
        <div><label for="agent-b">Agente</label><select id="agent-b"><option>Codex</option><option>Claude</option></select></div>
        <div class="mode"><label for="mode-b">Modo</label><select id="mode-b"><option>Em sequência (relay)</option><option>Em paralelo (swarm)</option><option>Persistente</option></select></div>
      </section>
      <div class="finish">
        <button class="primary" type="button">Criar tarefa</button>
        <section class="templates">
          <h2>Comece por um modelo</h2>
          <div><button type="button">Revisar alterações</button><button type="button">Executar testes</button></div>
        </section>
      </div>
    </div>
  </main>
</div>
</body>
</html>
