openapi: 3.0.3
info:
  title: hydra-orch Control Plane API
  version: v1.0.0
  description: "API do Control Plane do hydra-orch para orquestração de tarefas de engenharia com execução verificável.\n\n\
    **Autenticação:** Token local via header `Authorization: Bearer <token>`\n\n**CORS:** Allowlist estrita configurada em\
    \ `HYDRA_CORS_ALLOW_ORIGINS`. Wildcard `[\"*\"]` com credenciais é rejeitado.\n\n**Idempotência:** Operações de criação\
    \ (`POST /runs`, `POST /projects`, etc.) aceitam header `Idempotency-Key` + hash do payload (SHA-256). Mesma chave + mesmo\
    \ payload = mesmo resultado. Chave reutilizada com payload diferente = 409 Conflict.\n\n**Erros:** Envelope padronizado:\n\
    ```json\n{\n  \"code\": \"ERROR_CODE\",\n  \"message\": \"Descrição legível\",\n  \"run_id\": \"uuid-opcional\",\n  \"\
    retryable\": false\n}\n```\nCódigos: 400 (validação), 401 (auth), 403 (escopo), 404 (recurso), 409 (conflito/idempotência),\
    \ 410 (cursor expirado), 422 (schema/compatibilidade), 503 (dependência indisponível).\n\n**SSE:** `GET /runs/{id}/events`\
    \ aceita filtros `session_id`/`thread_id` e `follow=true` para acompanhamento contínuo:\n- `event:` tipo do evento\n-\
    \ `id:` sequência monotônica por run, inclusive nos filtros de sessão/thread\n- `retry:` 15000 (heartbeat 15s)\n- `data:`\
    \ JSON payload redigido\n- Replay via header `Last-Event-ID`. Cursor expirado → 410 Gone.\n\n**Versões de Schema:** Todos\
    \ specs incluem `schema_version` para evolução compatível.\n"
servers:
- url: http://localhost:8000
  description: Servidor local do hydra-orch (raiz HTTP /v1 e /health)
- url: http://localhost:8000/v1/control-plane
  description: Prefixo direto do Control Plane
security:
- BearerAuth: []
tags:
- name: Projects
  description: Gerenciamento de projetos Git
- name: Runs
  description: Execuções de tarefas (núcleo V0)
- name: Tasks
  description: Tarefas individuais dentro de uma run
- name: Artifacts
  description: Evidências e artefatos de execução
- name: Events
  description: Server-Sent Events para tempo real
- name: Integration
  description: Integração e merge de resultados
- name: Areas
  description: Áreas de trabalho (expansão V2)
- name: Workspaces
  description: Workspaces operacionais (expansão V2)
- name: Repositories
  description: Repositórios múltiplos por projeto (expansão V2)
- name: Agents
  description: Catálogo de agentes e executores (expansão V2)
- name: Profiles
  description: Perfis de execução combináveis (expansão V2)
- name: Sessions
  description: Sessões e threads multiagente (expansão V3)
- name: Metrics
  description: Observabilidade e métricas operacionais (expansão V3)
- name: Routing
  description: Seleção adaptativa de rotas (expansão V3)
- name: Memory
  description: Memória adaptativa consentida (expansão V4)
- name: Consents
  description: Gestão de consentimentos (expansão V4)
- name: Discovery
  description: Descoberta local controlada (expansão V4)
- name: Skills
  description: Skills de agentes (expansão V4)
- name: MCPs
  description: Servidores MCP (expansão V4)
- name: Extensions
  description: Extensões e plugins (expansão V4)
- name: Preferences
  description: Preferências escopadas e acessibilidade (expansão V4)
- name: Transports
  description: Transportes certificados (expansão V4)
- name: Tokens
  description: Tokens de acesso locais (expansão V4)
- name: OmniRoute
  description: Inventário de modelos, quotas 5h e seleção de conta OmniRoute (V5 / Onda 12)
- name: PTY
  description: Sessões interativas de terminal PTY autenticadas (V5 / Onda 12)
- name: Attachments
  description: Anexos AttachmentRef escopados por sessão/workspace (V5 / Onda 12)
- name: Search
  description: Busca global QuickOpen indexada no SQLite WAL (V5 / Onda 12)
- name: Automations
  description: Agendador durável AutomationSchedule e histórico de disparos (V5 / Onda 12)
- name: Inference
  description: Proxy de inferência compatível OpenAI
- name: Conversations
  description: Conversas duráveis, rotas por turno, eventos SSE e aplicação 3-way ao projeto
- name: Launcher
  description: Endpoints locais de bootstrap por nonce, sessão efêmera e seletor de pastas do Hydra Desktop
- name: System
  description: Health check, catálogo de modelos, status do orquestrador e quotas
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque local token (PBKDF2-SHA256 verifier)
  schemas:
    HitlCreatePayload:
      properties:
        kind:
          type: string
          enum:
          - needs_context
          - needs_approval
          title: Kind
        question:
          type: string
          maxLength: 100000
          minLength: 1
          title: Question
        task_id:
          title: Task Id
          nullable: true
          type: string
        timeout_seconds:
          type: integer
          maximum: 86400.0
          minimum: 1.0
          title: Timeout Seconds
          default: 300
      additionalProperties: false
      type: object
      required:
      - kind
      - question
      title: HitlCreatePayload
    HitlResponsePayload:
      properties:
        response:
          type: string
          maxLength: 100000
          minLength: 1
          title: Response
        actor:
          type: string
          maxLength: 256
          minLength: 1
          title: Actor
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
        approved:
          type: boolean
          title: Approved
          default: true
      additionalProperties: false
      type: object
      required:
      - response
      - actor
      - expected_revision
      title: HitlResponsePayload
    HitlRequest:
      properties:
        schema_version:
          type: string
          title: Schema Version
          default: '1.0'
          enum:
          - '1.0'
        request_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Request Id
        run_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Run Id
        task_id:
          title: Task Id
          nullable: true
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        kind:
          type: string
          enum:
          - needs_context
          - needs_approval
          title: Kind
        question:
          type: string
          minLength: 1
          title: Question
        state:
          type: string
          enum:
          - pending
          - answered
          - denied
          - expired
          - cancelled
          title: State
          default: pending
        revision:
          type: integer
          minimum: 1.0
          title: Revision
          default: 1
        created_at:
          type: string
          format: date-time
          title: Created At
        deadline:
          type: string
          format: date-time
          title: Deadline
        response:
          title: Response
          nullable: true
          type: string
        actor:
          title: Actor
          nullable: true
          type: string
        resolved_at:
          title: Resolved At
          nullable: true
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - request_id
      - run_id
      - kind
      - question
      - created_at
      - deadline
      title: HitlRequest
    SessionCreatePayload:
      properties:
        origin_ref:
          title: Origin Ref
          nullable: true
          type: string
          maxLength: 256
        agent_ref:
          title: Agent Ref
          nullable: true
          type: string
          maxLength: 128
      additionalProperties: false
      type: object
      title: SessionCreatePayload
    ThreadCreatePayload:
      properties:
        parent_thread_id:
          title: Parent Thread Id
          nullable: true
          type: string
          maxLength: 128
        agent_ref:
          title: Agent Ref
          nullable: true
          type: string
          maxLength: 128
      additionalProperties: false
      type: object
      title: ThreadCreatePayload
    SessionTransitionPayload:
      properties:
        state:
          type: string
          enum:
          - created
          - running
          - waiting
          - completed
          - failed
          - cancelled
          title: State
        expected_state:
          type: string
          enum:
          - created
          - running
          - waiting
          - completed
          - failed
          - cancelled
          title: Expected State
      additionalProperties: false
      type: object
      required:
      - state
      - expected_state
      title: SessionTransitionPayload
    ThreadMessagePayload:
      properties:
        content:
          type: string
          maxLength: 100000
          minLength: 1
          title: Content
        expected_last_seq:
          type: integer
          minimum: 0.0
          title: Expected Last Seq
      additionalProperties: false
      type: object
      required:
      - content
      - expected_last_seq
      title: ThreadMessagePayload
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Campo 'objective' é obrigatório
        run_id:
          type: string
          format: uuid
          nullable: true
        retryable:
          type: boolean
          example: false
    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        sort_by:
          type: string
        sort_order:
          type: string
          enum:
          - asc
          - desc
          default: desc
    PaginatedResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer
    ProjectCreateRequest:
      type: object
      required:
      - canonical_root
      - name
      properties:
        canonical_root:
          type: string
          format: path
          description: Caminho absoluto do repositório Git
          example: /home/user/meu-projeto
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: meu-projeto
        base_branch:
          type: string
          default: main
          example: main
        base_sha:
          type: string
          pattern: ^[a-f0-9]{40}$
          description: SHA base opcional (auto-resolve se omitido)
          example: a1b2c3d4e5f6...
        project_id:
          type: string
          nullable: true
          description: Identificador explícito opcional do projeto
        workspace_id:
          type: string
          nullable: true
          description: Workspace organizacional opcional
        allow_plain_folder:
          type: boolean
          default: false
          description: Permite cadastrar pasta comum sem repositório Git inicializado
    ProjectResponse:
      type: object
      required:
      - id
      - canonical_root
      - name
      - base_branch
      - base_sha
      - created_at
      properties:
        id:
          type: string
          format: uuid
        canonical_root:
          type: string
        name:
          type: string
        base_branch:
          type: string
        base_sha:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSummary:
      allOf:
      - $ref: '#/components/schemas/ProjectResponse'
      - type: object
        properties:
          runs_count:
            type: integer
          last_run_at:
            type: string
            format: date-time
            nullable: true
    CheckSpec:
      type: object
      required:
      - check_id
      - command
      properties:
        check_id:
          type: string
          description: Identificador estável do critério dentro da tarefa
          example: unit
        command:
          type: array
          minItems: 1
          items:
            type: string
          description: Argumentos preservados para execução sem shell (contrato S02)
          example:
          - python
          - -m
          - pytest
          - tests/
          - -q
        cwd:
          type: string
          description: Diretório de trabalho relativo à worktree
          example: .
        description:
          type: string
          default: ''
          example: Executa suite de testes unitários
    BudgetPolicyRequest:
      type: object
      properties:
        max_usd:
          type: number
          minimum: 0
          nullable: true
        max_tokens_in:
          type: integer
          minimum: 0
          nullable: true
        max_tokens_out:
          type: integer
          minimum: 0
          nullable: true
        max_wall_seconds:
          type: integer
          minimum: 60
          nullable: true
        alert_threshold_pct:
          type: number
          minimum: 50
          maximum: 99
          default: 80.0
    TaskSpecRequest:
      type: object
      required:
      - objective
      - acceptance_criteria
      properties:
        objective:
          type: string
          minLength: 10
          maxLength: 5000
        acceptance_criteria:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckSpec'
        allowed_paths:
          type: array
          items:
            type: string
          default:
          - '**/*'
        dependencies:
          type: array
          items:
            type: string
          default: []
          description: IDs de tasks das quais esta depende
        timeout_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
        max_repair_attempts:
          type: integer
          minimum: 0
          maximum: 5
          default: 2
    RunCreateRequest:
      type: object
      required:
      - project_id
      - objective
      - task_spec
      - idempotency_key
      properties:
        project_id:
          type: string
          format: uuid
        objective:
          type: string
          minLength: 10
          maxLength: 5000
        mode:
          type: string
          enum:
          - swarm
          - relay
          - persistent
          default: relay
        task_spec:
          $ref: '#/components/schemas/TaskSpecRequest'
        budget:
          $ref: '#/components/schemas/BudgetPolicyRequest'
        profile_id:
          type: string
          format: uuid
          nullable: true
        idempotency_key:
          type: string
          minLength: 16
          maxLength: 64
          description: Chave única para idempotência (SHA-256 recomendado)
    RunResponse:
      type: object
      required:
      - run_id
      - status
      - created_at
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - waiting
          - reviewing
          - succeeded
          - failed
          - cancelled
        created_at:
          type: string
          format: date-time
    RunSummary:
      type: object
      required:
      - id
      - project_id
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        objective:
          type: string
        mode:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - waiting
          - reviewing
          - succeeded
          - failed
          - cancelled
        base_sha:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RunDetailResponse:
      allOf:
      - $ref: '#/components/schemas/RunSummary'
      - type: object
        required:
        - spec
        - revision
        - tasks
        - budget
        properties:
          spec:
            type: object
            description: RunSpec completo com schema_version
          revision:
            type: integer
            description: Controle de concorrência otimista
          tasks:
            type: array
            items:
              $ref: '#/components/schemas/TaskResponse'
          budget:
            $ref: '#/components/schemas/BudgetStatus'
    BudgetStatus:
      type: object
      properties:
        max_usd:
          type: number
          nullable: true
        max_tokens_in:
          type: integer
          nullable: true
        max_tokens_out:
          type: integer
          nullable: true
        max_wall_seconds:
          type: integer
          nullable: true
        alert_threshold_pct:
          type: number
        current_usd:
          type: number
          nullable: true
        current_tokens_in:
          type: integer
          nullable: true
        current_tokens_out:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - active
          - alerted
          - frozen
          - exhausted
    TaskResponse:
      type: object
      required:
      - id
      - run_id
      - spec
      - status
      - revision
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        spec:
          $ref: '#/components/schemas/TaskSpecRequest'
        status:
          type: string
          enum:
          - pending
          - running
          - needs_context
          - blocked
          - failed
          - ready_for_review
          - accepted
          - rejected
          - cancelled
        revision:
          type: integer
        current_attempt:
          $ref: '#/components/schemas/AttemptResponse'
          nullable: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AttemptResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttemptResponse:
      type: object
      required:
      - id
      - task_id
      - ordinal
      - executor_id
      - provider_model_json
      - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        ordinal:
          type: integer
        executor_id:
          type: string
        provider_model_json:
          type: string
        provider_session:
          type: string
          nullable: true
        process_status:
          type: string
          enum:
          - queued
          - running
          - exited
          - timed_out
          - cancelled
          - crashed
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          $ref: '#/components/schemas/ResultResponse'
          nullable: true
    ResultResponse:
      type: object
      required:
      - id
      - attempt_id
      - simulated
      - outcome
      - summary
      - created_at
      properties:
        id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        exit_code:
          type: integer
          nullable: true
        simulated:
          type: boolean
        outcome:
          type: string
          enum:
          - success
          - failure
          - partial
        summary:
          type: string
        patch_artifact_id:
          type: string
          format: uuid
          nullable: true
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResultResponse'
        created_at:
          type: string
          format: date-time
    CheckResultResponse:
      type: object
      required:
      - id
      - command_json
      - cwd
      - tested_sha
      - exit_code
      - started_at
      - finished_at
      properties:
        id:
          type: string
          format: uuid
        result_id:
          type: string
          format: uuid
          nullable: true
        integration_id:
          type: string
          format: uuid
          nullable: true
        command_json:
          type: string
        cwd:
          type: string
        tested_sha:
          type: string
        exit_code:
          type: integer
        output_artifact_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    RetryRequest:
      type: object
      properties:
        force_reconciliation:
          type: boolean
          default: false
          description: Forçar reconciliação de efeitos ambíguos antes de nova tentativa
    RetryResponse:
      type: object
      required:
      - attempt_id
      - status
      properties:
        attempt_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - blocked
    ReviewRequest:
      type: object
      required:
      - decision
      - reason
      - expected_revision
      properties:
        decision:
          type: string
          enum:
          - accepted
          - rejected
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        expected_revision:
          type: integer
          minimum: 1
    ReviewResponse:
      type: object
      required:
      - review_id
      - decision
      - created_at
      properties:
        review_id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - accepted
          - rejected
        created_at:
          type: string
          format: date-time
    CancelRequest:
      type: object
      properties:
        scope:
          type: string
          enum:
          - run
          - task
          - attempt
          default: run
        task_id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
    CancelResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - cancelled
          - cancel_failed
          - already_terminal
        message:
          type: string
        killed_pids:
          type: array
          items:
            type: integer
    ArtifactResponse:
      type: object
      required:
      - id
      - run_id
      - relative_path
      - kind
      - sha256
      - size_bytes
      - created_at
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
          nullable: true
        relative_path:
          type: string
        kind:
          type: string
          enum:
          - patch
          - check_output
          - log
          - handoff
          - export
          - pr_package
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
    RunEventPayload:
      type: object
      required:
      - run_id
      - seq
      - type
      - payload
      - timestamp
      properties:
        session_id:
          type: string
          nullable: true
        thread_id:
          type: string
          nullable: true
        run_id:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
          enum:
          - run.created
          - run.started
          - run.finished
          - run.cancelled
          - task.queued
          - task.started
          - task.needs_context
          - task.completed
          - task.failed
          - task.cancelled
          - attempt.provider_selected
          - attempt.rate_limited
          - attempt.handoff_created
          - artifact.created
          - check.finished
          - merge.completed
          - merge.conflicted
          - budget.alerted
          - budget.frozen
          - budget.exhausted
          - heartbeat
          - profile.snapshot_created
          - session.created
          - session.state_changed
          - thread.created
          - thread.state_changed
          - thread.message
          - metric.sampled
          - hitl.requested
          - hitl.resolved
          - route.selected
          - route.rejected
        task_id:
          type: string
          format: uuid
          nullable: true
        attempt_id:
          type: string
          format: uuid
          nullable: true
