        created_at:
          type: string
          format: date-time
    MemoryScope:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        scope_type:
          type: string
          enum:
          - principal
          - area
          - workspace
          - project
          title: Scope Type
        scope_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Scope Id
      additionalProperties: false
      type: object
      required:
      - scope_type
      - scope_id
      title: MemoryScope
    MemoryWrite:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        scope_type:
          type: string
          enum:
          - principal
          - area
          - workspace
          - project
          title: Scope Type
        scope_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Scope Id
        content:
          type: string
          maxLength: 16384
          minLength: 1
          title: Content
        consent_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          - type: 'null'
          title: Consent Id
        retention_policy:
          type: string
          enum:
          - day
          - month
          title: Retention Policy
      additionalProperties: false
      type: object
      required:
      - scope_type
      - scope_id
      - content
      - retention_policy
      title: MemoryWrite
    MemoryEntry:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        memory_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Memory Id
        scope_type:
          type: string
          enum:
          - principal
          - area
          - workspace
          - project
          title: Scope Type
        scope_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Scope Id
        content_redacted:
          type: string
          minLength: 1
          title: Content Redacted
        author_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Author Ref
        consent_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Consent Id
        version:
          type: integer
          minimum: 1.0
          title: Version
        retention_policy_id:
          type: string
          enum:
          - day
          - month
          title: Retention Policy Id
        status:
          type: string
          enum:
          - pending_consent
          - active
          - revoked
          - rejected
          - expired
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - memory_id
      - scope_type
      - scope_id
      - content_redacted
      - author_ref
      - consent_id
      - version
      - retention_policy_id
      - status
      - created_at
      - expires_at
      title: MemoryEntry
    ConsentRecord:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        consent_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Consent Id
        principal_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          title: Principal Id
        purpose:
          type: string
          const: memory
          title: Purpose
        scope:
          type: string
          title: Scope
        status:
          type: string
          enum:
          - requested
          - granted
          - denied
          - revoked
          - expired
          title: Status
        granted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Granted At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      additionalProperties: false
      type: object
      required:
      - consent_id
      - principal_id
      - purpose
      - scope
      - status
      title: ConsentRecord
    ConsentActionPayload:
      properties:
        action:
          type: string
          enum:
          - granted
          - denied
          - revoked
          - expired
          title: Action
      additionalProperties: false
      type: object
      required:
      - action
      title: ConsentActionPayload
    ConversationConnectionSettings:
      properties:
        base_url:
          type: string
          maxLength: 500
          minLength: 1
          title: Base Url
        enabled:
          type: boolean
          title: Enabled
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
        idempotency_key:
          type: string
          maxLength: 100
          minLength: 16
          title: Idempotency Key
      additionalProperties: false
      type: object
      required:
      - base_url
      - enabled
      - expected_version
      - idempotency_key
      title: ConversationConnectionSettings
    ConversationCreatePayload:
      properties:
        content:
          type: string
          maxLength: 100000
          minLength: 1
          title: Content
        idempotency_key:
          type: string
          maxLength: 100
          minLength: 16
          title: Idempotency Key
        expected_last_seq:
          type: integer
          minimum: 0.0
          title: Expected Last Seq
          default: 0
        draft_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Session Id
        attachment_ids:
          items:
            type: string
          type: array
          maxItems: 10
          title: Attachment Ids
        expected_route_revision:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Expected Route Revision
        project_id:
          type: string
          title: Project Id
        executor:
          type: string
          enum:
          - codex
          - claude
          title: Executor
          default: codex
        access_mode:
          type: string
          enum:
          - read-only
          - workspace-write
          title: Access Mode
          default: read-only
        route:
          anyOf:
          - $ref: '#/components/schemas/ConversationRoute'
          - type: 'null'
        execution_mode:
          type: string
          enum:
          - single
          - swarm
          title: Execution Mode
          default: single
        auto_route:
          type: boolean
          title: Auto Route
          default: false
      additionalProperties: false
      type: object
      required:
      - content
      - idempotency_key
      - project_id
      title: ConversationCreatePayload
    ConversationMessagePayload:
      properties:
        content:
          type: string
          maxLength: 100000
          minLength: 1
          title: Content
        idempotency_key:
          type: string
          maxLength: 100
          minLength: 16
          title: Idempotency Key
        expected_last_seq:
          type: integer
          minimum: 0.0
          title: Expected Last Seq
          default: 0
        draft_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Session Id
        attachment_ids:
          items:
            type: string
          type: array
          maxItems: 10
          title: Attachment Ids
        expected_route_revision:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Expected Route Revision
      additionalProperties: false
      type: object
      required:
      - content
      - idempotency_key
      title: ConversationMessagePayload
    ConversationRoute:
      properties:
        executor:
          type: string
          enum:
          - codex
          - claude
          title: Executor
          default: codex
        connection_mode:
          type: string
          enum:
          - direct
          - omniroute
          title: Connection Mode
          default: direct
        target_kind:
          type: string
          enum:
          - model
          - combo
          title: Target Kind
          default: model
        target_ref:
          type: string
          maxLength: 300
          title: Target Ref
          default: ''
      additionalProperties: false
      type: object
      title: ConversationRoute
    ConversationRouteChange:
      properties:
        route:
          $ref: '#/components/schemas/ConversationRoute'
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        idempotency_key:
          type: string
          maxLength: 100
          minLength: 16
          title: Idempotency Key
        execution_mode:
          anyOf:
          - type: string
            enum:
            - single
            - swarm
          - type: 'null'
          title: Execution Mode
        auto_route:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Route
      additionalProperties: false
      type: object
      required:
      - route
      - expected_revision
      - idempotency_key
      title: ConversationRouteChange
    ConversationApplyPayload:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Força sincronização mesmo se arquivos na pasta original mudaram externamente
      title: ConversationApplyPayload
    WorkspaceUpdatePayload:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expected_revision:
          type: integer
          minimum: 1
          nullable: true
      title: WorkspaceUpdatePayload
    TokenSummaryResponse:
      type: object
      required:
      - id
      - principal_id
      - scopes
      - expires_at
      properties:
        id:
          type: string
        principal_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      title: TokenSummaryResponse
    RunDiscardPayload:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Remove worktrees mesmo com alterações locais não integradas
      title: RunDiscardPayload
paths:
  /health:
    get:
      tags:
      - System
      summary: Verificar saúde do servidor HTTP e adaptadores configurados
      operationId: healthCheck
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Servidor saudável
  /v1/health:
    get:
      tags:
      - System
      summary: Verificar saúde do servidor no prefixo versionado /v1
      operationId: healthCheckV1
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Servidor saudável
  /v1/models:
    get:
      tags:
      - Inference
      summary: Listar modelos lógicos e adaptadores disponíveis (compatível OpenAI)
      operationId: listModels
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catálogo de modelos
  /v1/chat/completions:
    post:
      tags:
      - Inference
      summary: Proxy de inferência compatível OpenAI
      operationId: chatCompletions
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Resposta do modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '400':
          description: Parâmetros inválidos
        '422':
          description: Modelo não suporta ferramentas/parâmetros solicitados
        '503':
          description: Nenhum provedor disponível
  /v1/orchestrator/status:
    get:
      tags:
      - System
      summary: Consultar modo padrão, diretório de worktrees, adaptadores e túnel SSH
      operationId: getOrchestratorStatus
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Status operacional do orquestrador
  /v1/quota:
    get:
      tags:
      - OmniRoute
      summary: Consultar janelas de quota de 5h via OmniRoute ou estado unknown em modo direto
      operationId: getQuotaStatus
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Mapa de quotas por provedor/assinatura
  /v1/launcher/pick-folder:
    post:
      tags:
      - Launcher
      summary: Abrir diálogo nativo de seleção de pasta via HydraLauncher
      operationId: pickDesktopFolder
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Caminho selecionado ou nulo se cancelado
        '404':
          description: Requisição fora de loopback
        '503':
          description: Executável do launcher indisponível
  /v1/launcher/ping:
    get:
      tags:
      - Launcher
      summary: Sondar prontidão da instância desktop local e estado de inicialização do OmniRoute
      operationId: pingDesktopServer
      security: []
      responses:
        '200':
          description: Servidor desktop pronto
        '404':
          description: Modo desktop inativo
  /v1/launcher/session:
    post:
      tags:
      - Launcher
      summary: Trocar bootstrap nonce de uso único por token efêmero de sessão desktop
      operationId: exchangeDesktopBootstrapSession
      security: []
      responses:
        '200':
          description: Token efêmero de sessão emitido
        '403':
          description: Nonce inválido, expirado ou cabeçalhos de origem recusados
  /v1/launcher/stop:
    post:
      tags:
      - Launcher
      summary: Solicitar encerramento limpo da instância desktop local
      operationId: stopDesktopServer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Encerramento iniciado
        '404':
          description: Modo desktop inativo
  /v1/launcher/ticket:
    post:
      tags:
      - Launcher
      summary: Emitir bootstrap nonce CSPRNG de uso único para o HydraLauncher local
      operationId: issueDesktopBootstrapTicket
      security: []
      responses:
        '200':
          description: Nonce de bootstrap emitido
        '404':
          description: Modo desktop desabilitado ou origem fora de loopback
  /v1/control-plane/projects:
    get:
      tags:
      - Projects
      summary: Listar projetos cadastrados
      operationId: listProjects
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Lista de projetos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
    post:
      tags:
      - Projects
      summary: Cadastrar projeto
      operationId: createProject
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Projeto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Raiz inválida ou sem .git
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido
        '403':
          description: Raiz fora da allowlist
        '409':
          description: Projeto já existe para esta raiz
  /v1/control-plane/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: Obter projeto
      operationId: getProject
      security:
      - BearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Projeto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Projeto não encontrado
  /v1/control-plane/runs:
    post:
      tags:
      - Runs
      summary: Submeter nova execução
      operationId: createRun
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateRequest'
      responses:
        '202':
          description: Run aceito para processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          description: Validação falhou
        '401':
          description: Token inválido
        '403':
          description: Sem permissão no projeto
        '409':
          description: Idempotency-Key reutilizada com payload diferente
        '422':
          description: Schema inválido ou perfil incompatível
    get:
      tags:
      - Runs
      summary: Listar execuções
      operationId: listRuns
      security:
      - BearerAuth: []
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - waiting
          - reviewing
          - succeeded
          - failed
          - cancelled
      - $ref: '#/components/schemas/PaginationParams'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/RunSummary'
  /v1/control-plane/runs/{run_id}:
    get:
      tags:
      - Runs
      summary: Obter detalhes da execução
      operationId: getRun
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detalhes da run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailResponse'
        '404':
          description: Run não encontrada
  /v1/control-plane/runs/{run_id}/tasks:
    get:
      tags:
      - Tasks
      summary: Listar tarefas da execução
      operationId: listRunTasks
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lista de tarefas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Run não encontrada
  /v1/control-plane/runs/{run_id}/artifacts:
    get:
      tags:
      - Artifacts
      summary: Listar artefatos da execução
      operationId: listRunArtifacts
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - patch
          - check_output
          - log
          - handoff
          - export
          - pr_package
      responses:
        '200':
          description: Lista de artefatos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactResponse'
        '404':
          description: Run não encontrada
  /v1/control-plane/runs/{run_id}/events:
    get:
      tags:
      - Events
      summary: Stream de eventos (SSE)
      operationId: getRunEvents
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          description: Cursor para replay (sequência monotônica)
      - name: session_id
        in: query
        schema:
          type: string
      - name: thread_id
        in: query
        schema:
          type: string
      - name: follow
        in: query
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      responses:
        '200':
          description: Stream SSE
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunEventPayload'
        '404':
          description: Run não encontrada
        '410':
          description: Cursor expirado, solicitar snapshot completo
  /v1/control-plane/runs/{run_id}/cancel:
    post:
      tags:
      - Runs
      summary: Cancelar execução
      operationId: cancelRun
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Cancelamento processado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '404':
          description: Run não encontrada
        '409':
          description: Run já em estado terminal
  /v1/control-plane/runs/{run_id}/tasks/{task_id}/retry:
    post:
      tags:
      - Tasks
      summary: Nova tentativa após reconciliação
      operationId: retryTask
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '200':
          description: Nova tentativa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryResponse'
        '404':
          description: Run ou task não encontrada
        '409':
          description: Tentativa ativa já existe ou reconciliação pendente
  /v1/control-plane/runs/{run_id}/tasks/{task_id}/review:
    post:
      tags:
      - Tasks
      summary: Revisar resultado da tarefa
      operationId: reviewTask
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Revisão registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Decisão inválida
        '404':
          description: Run, task ou resultado não encontrado
        '409':
          description: Revisão vencida (expected_revision divergente) ou transição inválida
  /v1/control-plane/runs/{run_id}/integrate:
    post:
      tags:
      - Integration
      summary: Integrar resultados aceitos
      operationId: integrateRun
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrateRequest'
      responses:
        '200':
          description: Integração processada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrateResponse'
        '404':
          description: Run não encontrada
        '409':
          description: Resultados não aceitos ou checks obrigatórios falhando
        '422':
          description: Conflito de merge (conflict_report_id retornado)
  /v1/control-plane/areas:
    get:
      tags:
      - Areas
