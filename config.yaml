version: "5.0"

hydra:
  proxy_host: "127.0.0.1"
  proxy_port: 8000
  default_mode: 2 # Proxy sequencial; execução verificável CLI será entregue em M1.
  preferred_primary_model: "fast_classifier"
  inference_fallback_chain: ["fast_classifier"]
  worktree_base_dir: ".orchestrator/worktree"
  state_db: ".orchestrator/checkpoints.sqlite"
  auto_heal_build_errors: true
  max_heal_attempts: 2

# Configuração do primeiro driver; execução/certificação pertencem à T04.
execution:
  driver: "codex"
  model: null # Selecionar explicitamente na certificação; não presume modelo disponível.
  timeout_seconds: 300

# Somente entradas habilitadas são instanciadas. CLI Codex/Claude não equivale a CDP.
providers:
  ui_cdp:
    claude_pro: {enabled: false, cdp_port: 9222}
    chatgpt_plus: {enabled: false, cdp_port: 9223}
    gemini_pro: {enabled: false, cdp_port: 9224}
  ide_bridge:
    antigravity: {enabled: false, bridge_url: "http://127.0.0.1:9330"}
  api_gateway:
    openrouter:
      enabled: false
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
    deepseek:
      enabled: false
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "DEEPSEEK_API_KEY"
  remote_local:
    ollama_local:
      enabled: true
      base_url: "http://127.0.0.1:11434"
      default_model: "qwen2.5-coder:7b"

# ============================================================================
# INTEGRAÇÃO COM O OMNIROUTE GATEWAY (Conexão OAuth Assinaturas + Free Tiers)
# ============================================================================
omniroute:
  # Optional gateway: Hydra operates in direct mode when disabled or connection_mode is disabled.
  enabled: false
  auto_start_daemon: false
  connection_mode: "disabled" # disabled | optional | required
  base_url: "http://127.0.0.1:20128/v1"
  quota_api_url: "http://127.0.0.1:20128/api/usage/quota"
  default_routing_strategy: "auto/thrifty"

  # Mapeamento dos Modelos Lógicos Configurados no OmniRoute
  logical_models:
    architect_heavy:
      primary: "claude-code/claude-3-7-sonnet"
      fallbacks: ["agy/gemini-4-argon-high", "antigravity/gemini-2-5-pro", "openrouter/deepseek-r1:free"]
      min_difficulty: 8

    fullstack_coder:
      primary: "codex/gpt-4o-plus"
      fallbacks: ["claude-code/claude-3-7-sonnet"]
      min_difficulty: 6

    context_and_docs:
      primary: "agy/gemini-4-argon-high"
      fallbacks: ["gemini/gemini-2-5-pro"]
      min_difficulty: 4

    database_and_tests:
      primary: "ssh-home-gpu/qwen2.5-coder:32b"
      adapter: "ssh_remote"
      fallbacks: ["deepseek/deepseek-chat", "openrouter/qwen-2.5-coder-32b-instruct:free"]
      min_difficulty: 3

    fast_classifier:
      primary: "local-ollama/qwen2.5-coder:7b"
      adapter: "ollama_local"
      fallbacks: ["openrouter/llama-3.3-70b-instruct:free"]
      min_difficulty: 1

# ============================================================================
# CONEXÃO AUTOMÁTICA COM OUTRO PC MAIS FORTE EM CASA (VIA SSH)
# ============================================================================
remote_ssh_gpu:
  enabled: false
  ssh_target: "usuario@192.168.1.100"
  ssh_port: 22
  ssh_key: "~/.ssh/id_ed25519"
  local_port: 11435
  remote_port: 11434
  healthcheck_interval_sec: 10
  auto_register_in_omniroute: true

# ============================================================================
# COMPORTAMENTO DOS 3 MODOS DE EXECUÇÃO
# ============================================================================
modes:
  mode_1_swarm:
    max_parallel_worktrees: 4
    worker_cli: "codex" # Configurado; suporte de execução será certificado separadamente.
    wave_0_foundation_enabled: true
    lock_dependency_manifests_in_wave_1: true
    symlink_dirs: ["node_modules", ".venv", "vendor"]
    roles:
      backend_core: "architect_heavy"
      frontend_ui: "fullstack_coder"
      db_and_tests: "database_and_tests"
      docs_and_review: "context_and_docs"

  mode_2_relay:
    sequence:
      - stage: "contract_and_plan"
        model: "architect_heavy"
      - stage: "implementation"
        model: "fullstack_coder"
      - stage: "unit_and_integration_tests"
        model: "database_and_tests"
      - stage: "documentation"
        model: "context_and_docs"
    mid_stream_hot_swap: true
    handoff_strategy: "worktree_state" # worktree_state | atomic_turn_retry

  mode_3_persistent:
    locked_model: "architect_heavy"
    wait_for_5h_quota_reset: true
    poll_quota_interval_sec: 30
    resume_strategy: "worktree_state"
    stitch_anchor_lines: 15

# ============================================================================
# INTERFACE VISUAL DO CONTROL PLANE (PREPARAÇÃO; CLIENTE AINDA NÃO IMPLEMENTADO)
# ============================================================================
visual_interface:
  enabled: false
  host: "127.0.0.1"
  port: 5173
  api_base_path: "/v1"
  expose_projects: true
  expose_runs: true
  expose_worktrees: true
  expose_diffs: true
  expose_quota: true
