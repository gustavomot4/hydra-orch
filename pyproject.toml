[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydra-orch"
version = "0.1.0"
description = "Universal Autonomous LLM Orchestrator & Local Software Engineering Middleware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "hydra-orch team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "gitpython>=3.1.42"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
hydra = "hydra_orch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hydra_orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Hermetic unit tests for schemas, config, and state machines",
    "integration: Multi-component integration tests (RunService, GitWorkspace, ExecutionStore)",
    "e2e: End-to-end M1 control plane flows",
    "negative: Objective negative test criteria (§7.A of technical PRD)",
    "security: Local auth, strict CORS allowlist, and path/scope validation tests",
    "a11y: Accessibility verification tests"
]
